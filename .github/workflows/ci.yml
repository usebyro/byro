name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build

  backend:
    name: Backend (checks, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      DB_ENGINE: django.db.backends.sqlite3
      DEBUG: "True"
      # SECRET_KEY has no default any more — settings.py fails loudly rather
      # than falling back to the insecure literal that used to be committed.
      # This value is throwaway and only ever used by CI.
      SECRET_KEY: ci-only-not-a-real-secret-key-do-not-reuse
      # The test suite overrides every WorkOS setting explicitly, so these are
      # only here to keep settings.py importable without a .env file.
      WORKOS_CLIENT_ID: client_ci_placeholder
      WORKOS_API_KEY: sk_ci_placeholder
      # bryo.apps.BryoConfig.ready() raises in DEBUG if these are unset, so
      # they're required just to let manage.py check/test start up.
      POSTHOG_PROJECT_TOKEN: ci_posthog_placeholder
      POSTHOG_HOST: https://us.i.posthog.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test
